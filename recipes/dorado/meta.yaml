{% set name = "dorado" %}
{% set version = "1.3.0" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://cdn.oxfordnanoportal.com/software/analysis/dorado-{{ version }}-linux-x64.tar.gz
  sha256: c558bf1bd319ef8af2af7a1a1e181a4ba7f3f95cd9878ff701465c8f596026e0

build:
  number: 0
  skip: true  # [not linux]
  binary_relocation: false
  detect_binary_files_with_prefix: false
  script: |
    mkdir -p $PREFIX/bin $PREFIX/lib
    cp dorado-{{ version }}-linux-x64/bin/dorado $PREFIX/bin/
    cp -a dorado-{{ version }}-linux-x64/lib/* $PREFIX/lib/
    chmod +x $PREFIX/bin/dorado
  missing_dso_whitelist:
    - "*"
  run_exports:
    - {{ pin_subpackage(name, max_pin="x") }}

requirements:
  run:
    - libgcc-ng
    - libstdcxx-ng

test:
  commands:
    - dorado --version

about:
  home: https://github.com/nanoporetech/dorado
  license: ONT Public License
  license_family: Other
  license_file: LICENSE
  summary: 'Dorado: Oxford Nanopore Technologies basecaller'
  description: |
    Dorado is a high-performance, easy-to-use, open source basecaller 
    for Oxford Nanopore sequencing data.
  dev_url: https://github.com/nanoporetech/dorado
  doc_url: https://github.com/nanoporetech/dorado

extra:
  identifiers:
    - doi:10.1038/s41587-023-01643-w
  additional-platforms:
    - linux-aarch64
    - osx-arm64
  skip-lints:
    - should_be_noarch_generic
  recipe-maintainers:
    - SiYangming